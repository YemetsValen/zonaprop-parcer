name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          # Tests use their own in-memory env; these are minimal sentinels so
          # the Settings import succeeds before fixtures override them.
          TELEGRAM_BOT_TOKEN: "ci:token"
          TELEGRAM_CHAT_ID: "1"
          API_KEY: "ci-key"

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no Playwright)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zonaprop-bot:ci
          build-args: |
            USE_PLAYWRIGHT=false
