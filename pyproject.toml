[project]
name = "zonaprop-bot"
version = "0.1.0"
description = "Scrape ZonaProp.com.ar and notify Telegram about new listings."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ARG", "SIM"]
ignore = [
    # We use FastAPI's `Depends(...)` in defaults — that's the documented pattern.
    "B008",
    # Allow positional bool args in the API layer where Pydantic models suffice.
    "FBT001",
    "FBT002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
